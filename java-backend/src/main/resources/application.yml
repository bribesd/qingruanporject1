server:
  port: 3001

spring:
  datasource:
    # createDatabaseIfNotExist=true 会自动创建 enterprise_kb 数据库（需账号有建库权限）
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:sql/schema.sql
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  jwt:
    # 通过环境变量 JWT_SECRET 覆盖；HS256 要求至少 32 字节，否则启动失败
    secret: ${JWT_SECRET}
    expiration-days: 7
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-username: ${APP_INITIAL_ADMIN_USERNAME:admin}
    admin-password: ${APP_INITIAL_ADMIN_PASSWORD:}
  cors:
    origins: http://localhost:5173,http://127.0.0.1:5173
